services:
  cnc-frezka:
    build: .
    image: diy-cnc-frezka
    container_name: cnc-frezka
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      CNC_PASSWORD: ${CNC_PASSWORD:?Nastav CNC_PASSWORD v souboru .env}
      CNC_VIEWER_PASSWORD: ${CNC_VIEWER_PASSWORD:-}
      TZ: Europe/Prague
      # za reverzní proxy (Cloudflare tunel, nginx): přidej --trust-proxy do command
    volumes:
      - cnc-data:/data
    # zabezpečení: jen čtení kromě /data, bez privilegií a Linux capabilities
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cnc-data:
